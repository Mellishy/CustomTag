# ------------------------------------------------------------------------------------------------
# CustomTag - AI Moderation (module: ai)
# The AI runs AFTER the security/blacklist pipeline (never first), so obvious junk never costs
# an API call. Providers and keys live in ai/providers.yml; the prompt is ai/prompts/moderation.txt.
# Reload just this module with: /customtag reload ai
# ------------------------------------------------------------------------------------------------
version: 1

# DISABLED - no AI at all (staff review everything, exactly like before)
# SUGGEST  - AI annotates every request with its suggestion + confidence, staff still decide
# FULL     - AI decides autonomously when confident; borderline calls go to staff review
mode: DISABLED

confidence:
  # An APPROVED verdict below this confidence is downgraded to staff review.
  approve-threshold: 85
  # A REJECTED verdict below this confidence is downgraded to staff review.
  reject-threshold: 85

limits:
  # Hard cap on AI API calls per minute (cost protection). Requests over budget go to staff
  # review instead of queueing unbounded spend. 0 = unlimited.
  requests-per-minute: 20

# Whether an AI REJECTED decision refunds the token is configured in tokens/settings.yml
# (refunds.ai-reject) so all refund policy lives in one place.
