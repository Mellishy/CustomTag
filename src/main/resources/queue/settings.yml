# ------------------------------------------------------------------------------------------------
# CustomTag - Queue & Request Management (module: queue)
# Reload just this module with: /customtag reload queue
# ------------------------------------------------------------------------------------------------
version: 1

# Network-wide cap on how many requests may sit in the pending queue at once.
# When full, new submissions are refused BEFORE any token is taken. Set to 0 for unlimited.
# Can also be changed live with /customtag pending <amount>.
global-pending-limit: 50

# How long (minutes) a staff review lock on one request lasts before it auto-expires,
# so a reviewer who logs off can never jam a request forever.
lock-timeout-minutes: 5

# Automatically expire requests that sat in the queue longer than this many days.
# Expired requests refund the token by default (see tokens/settings.yml). 0 disables expiry.
expire-after-days: 7

# How often (minutes) the expiry sweep runs.
expire-check-minutes: 30

# How many CLOSED requests (approved/rejected/cancelled/...) are kept in the on-disk history
# for /customtag history, undo/reopen and staff search.
closed-history-cap: 500

# Priority given to requests per role (lower number = reviewed first). Roles are defined in
# permissions/roles.yml; a player's highest-weight role decides their priority here.
priorities:
  default: 3
  vip: 2
  staff: 1
