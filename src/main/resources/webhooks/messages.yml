# ------------------------------------------------------------------------------------------------
# CustomTag - Webhook message templates (module: webhooks)
# Nothing is hardcoded: every outbound message is built from these templates. "body" supports
# multi-line text and Discord markdown. "color" is the Discord embed color (hex).
#
# Placeholders (available per event, unknown ones stay visible for debugging):
#   {player} {custom_id} {tag} {tag_raw} {request_id} {server} {time}
#   {status} {actor} {actor_type} {reason} {refund} {queue_position} {queue_size}
#   {ai_provider} {ai_model} {ai_confidence} {ai_reason}
#   {type} {amount} {balance} {transaction_id}
# Note: {tag} has color codes stripped but keeps emojis/symbols (&7[&6King&7] -> [King]).
# ------------------------------------------------------------------------------------------------
version: 1

templates:
  REQUEST_CREATED:
    title: "New Tag Request"
    color: "E67E22"
    body: |-
      **Player:** {player} {custom_id}
      **Tag:** {tag}
      **Request:** {request_id}
      **Queue position:** {queue_position} / {queue_size}
      **Server:** {server}

  REQUEST_APPROVED:
    title: "Tag Approved"
    color: "2ECC71"
    body: |-
      **Player:** {player} {custom_id}
      **Tag:** {tag}
      **Request:** {request_id}
      **Approved by:** {actor} ({actor_type})

  REQUEST_REJECTED:
    title: "Tag Rejected"
    color: "E74C3C"
    body: |-
      **Player:** {player} {custom_id}
      **Tag:** {tag}
      **Request:** {request_id}
      **Rejected by:** {actor} ({actor_type})
      **Reason:** {reason}
      **Token refunded:** {refund}

  REQUEST_CANCELLED:
    title: "Request Cancelled"
    color: "95A5A6"
    body: |-
      **Player:** {player} {custom_id}
      **Tag:** {tag}
      **Request:** {request_id}

  REQUEST_EXPIRED:
    title: "Request Expired"
    color: "95A5A6"
    body: |-
      **Player:** {player} {custom_id}
      **Tag:** {tag}
      **Request:** {request_id}
      **Token refunded:** {refund}

  REQUEST_REOPENED:
    title: "Request Reopened"
    color: "3498DB"
    body: |-
      **Player:** {player} {custom_id}
      **Tag:** {tag}
      **Request:** {request_id}
      **Reopened by:** {actor}

  AI_DECISION:
    title: "AI Decision"
    color: "9B59B6"
    body: |-
      **Player:** {player} {custom_id}
      **Tag:** {tag}
      **Request:** {request_id}
      **Decision:** {status}
      **Provider:** {ai_provider} ({ai_model})
      **Confidence:** {ai_confidence}%
      **Reason:** {ai_reason}

  AI_REVIEW_REQUIRED:
    title: "AI Needs Staff Review"
    color: "F1C40F"
    body: |-
      **Player:** {player} {custom_id}
      **Tag:** {tag}
      **Request:** {request_id}
      **AI reason:** {ai_reason}

  TOKEN_TRANSACTION:
    title: "Token Transaction"
    color: "1ABC9C"
    body: |-
      **Player:** {player} {custom_id}
      **Type:** {type}
      **Amount:** {amount}
      **Balance:** {balance}
      **Transaction:** {transaction_id}
      **By:** {actor}

  QUEUE_FULL:
    title: "Pending Queue Full"
    color: "E74C3C"
    body: |-
      The pending queue reached its limit ({queue_size}).
      New requests are being refused until staff clear the backlog.

  SECURITY_ALERT:
    title: "Security Alert"
    color: "C0392B"
    body: |-
      **Player:** {player} {custom_id}
      **Alert:** {reason}
      **Server:** {server}

  MAINTENANCE:
    title: "Maintenance"
    color: "7F8C8D"
    body: |-
      {reason}
