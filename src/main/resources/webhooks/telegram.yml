# ------------------------------------------------------------------------------------------------
# CustomTag - Telegram endpoints (module: webhooks)
# Create a bot with @BotFather, add it to your group/channel, and put its token + the chat id
# here. Same event list as discord.yml.
# ------------------------------------------------------------------------------------------------
version: 1

endpoints:
  staff-group:
    enabled: false
    bot-token: "0000000000:REPLACE_ME"
    chat-id: "-1000000000000"
    rate-limit-per-minute: 20
    events:
      - REQUEST_CREATED
      - REQUEST_APPROVED
      - REQUEST_REJECTED
      - AI_REVIEW_REQUIRED
      - SECURITY_ALERT
