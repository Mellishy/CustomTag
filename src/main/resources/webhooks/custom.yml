# ------------------------------------------------------------------------------------------------
# CustomTag - Custom/generic endpoints (module: webhooks)
# For websites, dashboards, store systems and any custom application: the plugin POSTs a JSON
# object to your URL for each subscribed event, e.g.
#   {"event":"REQUEST_APPROVED","player":"Steve","custom_id":"<#3VF-2>","tag":"[King]",
#    "request_id":"REQ-00000042","actor":"AdminName","server":"lobby", ...}
# Same event list as discord.yml.
# ------------------------------------------------------------------------------------------------
version: 1

endpoints:
  my-website:
    enabled: false
    url: "https://example.com/api/customtag"
    rate-limit-per-minute: 60
    events:
      - REQUEST_APPROVED
      - REQUEST_REJECTED
      - TOKEN_TRANSACTION
