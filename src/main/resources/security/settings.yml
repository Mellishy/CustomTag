# ------------------------------------------------------------------------------------------------
# CustomTag - Security, Anti-Abuse & Anti-Duplication (module: security)
# Reload just this module with: /customtag reload security
# ------------------------------------------------------------------------------------------------
version: 1

submissions:
  # How many tag submissions (valid or not) one player may attempt per window.
  # Failed/blocked attempts count too - spamming invalid tags is exactly the abuse case.
  max-per-window: 5
  window-seconds: 60
  # Re-submitting the exact same (normalized) text within this many minutes is swallowed
  # instead of creating a duplicate request.
  duplicate-window-minutes: 10
