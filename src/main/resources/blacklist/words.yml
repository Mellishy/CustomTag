# ------------------------------------------------------------------------------------------------
# CustomTag - Blacklist word categories (module: blacklist)
# Each category has its OWN action and refund policy:
#   action: REJECT | AI_REVIEW | STAFF_REVIEW
#   refund: should the token be returned when this category causes a rejection?
#   match:  contains | exact   (matching runs on the normalized text, so "O_w-n3r", "0wner"
#           and Cyrillic/Greek lookalikes all hit the same entry as "owner")
# ------------------------------------------------------------------------------------------------
version: 1

categories:
  profanity:
    enabled: true
    action: REJECT
    refund: false          # penalty - profanity costs the token
    match: contains
    message: "&cThat tag contains blocked words."
    words:
      - "fuck"
      - "shit"
      - "bitch"
      - "cunt"
      - "nigger"
      - "faggot"
      - "kys"

  suspicious:
    enabled: true
    action: AI_REVIEW      # not conclusive - let the AI (or staff, if AI is off) decide
    refund: true
    match: contains
    message: "&eYour tag needs an extra review before it can be approved."
    words:
      - "hitler"
      - "nazi"
      - "isis"
