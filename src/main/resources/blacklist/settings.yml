# ------------------------------------------------------------------------------------------------
# CustomTag - Validation & Blacklist gateway (module: blacklist)
# Every submission passes these checks BEFORE any token is spent on the queue and BEFORE any AI
# call is made - order: unicode -> characters -> reserved.yml -> words.yml -> regex.yml
# Reload just this module with: /customtag reload blacklist
# ------------------------------------------------------------------------------------------------
version: 1

# Shown when a rule rejects a submission and defines no message of its own.
default-reject-message: "&cThat tag is not allowed."

unicode:
  # Zero-width / invisible / bidi-control characters have exactly one use in a tag: hiding
  # content from staff and the blacklist. Strongly recommended to keep enabled.
  block-invisible-characters: true
  # REJECT | AI_REVIEW | STAFF_REVIEW
  action: REJECT
  # Invisible characters are treated as an honest mistake by default - the token is returned.
  refund: true
  message: "&cYour tag contains invisible or control characters."

characters:
  # Minimum VISIBLE length (color codes don't count).
  min-length: 1
  # Optional regex the whole visible tag must match. Empty = all characters allowed.
  # Example (latin letters, digits, common symbols and spaces):
  # allowed-regex: "[\\p{L}\\p{N}\\p{P}\\p{S} ]+"
  allowed-regex: ""
  too-short-message: "&cYour tag is too short."
  invalid-characters-message: "&cYour tag contains characters that are not allowed."
