# ------------------------------------------------------------------------------------------------
# CustomTag - Token & Economy (module: tokens)
# Balance changes only ever happen through the central token service and every one of them is
# written to the permanent ledger (plugins/CustomTag/logs/tokens/tokens-YYYY-MM.jsonl) with a
# unique TOKEN-XXXXXXXX id. Reload with: /customtag reload tokens
# ------------------------------------------------------------------------------------------------
version: 1

# Refund policy per outcome. The blacklist module additionally
# defines per-category refund rules that take precedence for pre-queue rejections.
refunds:
  # Staff rejected the request through the admin GUI / Discord.
  staff-reject: true
  # The AI rejected the request.
  ai-reject: true
  # The AI system failed (provider down, timeout after retries) and the request could not be
  # decided - never charge the player for our failure.
  ai-failure: true
  # The request sat in the queue past queue.expire-after-days.
  queue-expired: true
